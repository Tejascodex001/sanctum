[package]
name = "sanctum-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sanctum's network engine: connections between friends over Tor"

[dependencies]
anyhow = "1"
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-service", "onion-service-client", "experimental-api", "static-sqlite"] }
async-trait = "0.1"
futures = "0.3"
# Tor's TLS needs a crypto backend; ring builds cleanly for Android.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sanctum-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tor-hscrypto = "0.47"
tor-hsservice = "0.47"
tor-llcrypto = "0.47"
tor-cell = "0.47"
tor-rtcompat = "0.47"
safelog = "0.10"
if-addrs = "0.15.0"
blake3 = "1.8.7"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.8"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
webpki-roots = "1.0.10"

[dev-dependencies]
rand = "0.8"
tempfile = "3"
