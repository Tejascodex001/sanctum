name: sanctum
description: Private, serverless chat.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  animations: ^3.0.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  flutter_secure_storage: ^11.2.0
  flutter_zxing: ^3.1.0
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  rust_lib_sanctum:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
