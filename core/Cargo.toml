[package]
name = "sanctum-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sanctum's shared core: identity, sigils, temp chats, transports"

[dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
