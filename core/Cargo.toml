[package]
name = "sanctum-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sanctum's shared core: identity, sigils, temp chats, transports"

[dependencies]
argon2 = "0.6.0"
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
openmls = "0.9"
openmls_basic_credential = "0.6"
openmls_memory_storage = { version = "0.6", features = ["persistence"] }
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
postcard = { version = "1", features = ["use-std"] }
rand = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha3 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
