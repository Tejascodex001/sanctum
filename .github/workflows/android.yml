name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # History and tags, for the changelog.
          fetch-depth: 0

      - name: Rust tests
        run: |
          cargo test --workspace
          cargo build -p rust_lib_sanctum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key secrets; this APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/release.jks
          printf 'storeFile=release.jks\nalias=sanctum\npassword=%s\n' "$KEYSTORE_PASSWORD" > app/android/key.properties

      - name: Analyze and build
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Verify signature
        run: |
          [ -f app/android/key.properties ] || exit 0
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $APKSIGNER verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256"

      - name: Remove signing key
        if: always()
        run: rm -f app/android/release.jks app/android/key.properties

      - name: Changelog
        run: python3 .github/scripts/changelog.py ${{ github.run_number }} changelog.md release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sanctum build ${{ github.run_number }}
          # Tag the commit that was built, not whatever main is by now.
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: release-notes.md
          # The app reads changelog.md to show what's new before updating.
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            changelog.md
