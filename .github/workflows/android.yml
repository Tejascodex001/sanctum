name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in order: each build's changelog starts from the
# previous build's tag, so that tag must exist first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # History and tags, for the changelog.
          fetch-depth: 0

      # Build N is the last published build plus one, so a build that was
      # cancelled or failed doesn't leave a gap in the numbers.
      - name: Build number
        id: number
        run: |
          git fetch --tags --force --quiet
          last=$(git tag --list 'build-*' | sed 's/^build-//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "n=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Rust tests
        run: |
          cargo test --workspace
          cargo build -p rust_lib_sanctum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key secrets; this APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/release.jks
          printf 'storeFile=release.jks\nalias=sanctum\npassword=%s\n' "$KEYSTORE_PASSWORD" > app/android/key.properties

      - name: Analyze and build
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --target-platform android-arm64 --build-number=${{ steps.number.outputs.n }}

      - name: Verify signature
        run: |
          [ -f app/android/key.properties ] || exit 0
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $APKSIGNER verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256"

      - name: Remove signing key
        if: always()
        run: rm -f app/android/release.jks app/android/key.properties

      - name: Changelog
        run: |
          # Tags made by releases since this run checked out.
          git fetch --tags --force --quiet
          python3 .github/scripts/changelog.py ${{ steps.number.outputs.n }} changelog.md release-notes.md

      - name: Version
        id: version
        run: echo "name=$(sed -n "s/^const appVersion = '\(.*\)';/\1/p" app/lib/version.dart)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.number.outputs.n }}
          # The tag stays build-N: installed apps look for it to update.
          name: Sanctum ${{ steps.version.outputs.name }}.${{ steps.number.outputs.n }}
          # Tag the commit that was built, not whatever main is by now.
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: release-notes.md
          # The app reads changelog.md to show what's new before updating.
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            changelog.md
